# How the aerostructural problem is modelled and solved for this kite, one
# block per subsystem: aerodynamics, structure, tether, coupling
# (awetrim.aerostructural.case.load_as_config). In each block the model
# choices come first, the solver settings after them.
#
# Not here:
#   - what a run IS -- the flight state, the wind, the atmosphere (rho, mu, g)
#     and the commanded tape lengths: the script's Case
#     (awetrim.aerostructural.case.Case);
#   - output options (plots, snapshots): the script's (case.OUTPUT_DEFAULTS,
#     an `output` override block);
#   - the KCU point (the moment reference and the fixed node): structure.yml's
#     (awetrim.kcu_point and its `fixed` point).
# Recipes (identification.yaml) override any block for their purpose.

aerodynamics:
  # -- model --
  # KCU bluff-body drag in the trim (finite cylinder on the tether axis,
  # awetrim.aerodynamics.kcu_drag; envelope from system.yaml
  # control_system.structure). Set false to reproduce a result from before
  # 2026-08-21, when the trim chain had no KCU drag at all.
  is_with_kcu_drag: !!bool true
  is_with_aero_bridle: !!bool true
  # Li/Gaunaa spanwise artificial viscosity (TORQUE 2026) in the gamma loop.
  # ON by default since 2026-08-31 -- a MODEL decision, not a solver one: near
  # stall the circulation is two-branched and AV-on solves sit on the
  # stalled-tip branch (CD +6.7% at the centre-sweep reference point), so
  # AV-on results are not comparable to the AV-off history. The trim scripts
  # inherit this value when --artificial-viscosity is not given, so both
  # halves of a coupled analysis stay on one model.
  is_aoa_corrected: !!bool false # force directions from the freestream (the AWETrim model); VSM develop's own default became true (quarter-chord flow) on 2026-09-17
  is_with_artificial_viscosity: !!bool true
  artificial_viscosity_factor: !!float 0.035
  # Drag of the bridle lines (is_with_aero_bridle)
  bridle:
    cd_cable: !!float 1.1
    cf_cable: !!float 0.01
    # How the unknown roll angle of a FLAT TAPE about its own axis is
    # treated (steering/depower tapes; lines with a "w" column in the
    # structural geometry). averaged = uniform-roll mean of the broadside
    # and edge-on limits; broadside|edge_on = that bracket; round =
    # pre-2026-08-21 behaviour, the area-equivalent circle.
    # See awetrim.aerodynamics.line_drag.
    tape_roll_model: averaged
  # The WIREFRAME's wing (read by wireframe.driver only; Billow full billows
  # its own membrane and maps loads through coupling.load_transfer).
  # Strut-to-strut trailing-edge contraction, LEI-V3 photogrammetry (Haanen
  # 2026, Table 9.2: -5.23 % powered, -3.86 % depowered); 0 = the built (CAD)
  # wing. docs/aerostructural/lei_v3_wing_corrections.md
  billowing:
    contraction: !!float 0.05
  # Panel load onto the ribs: strut_lever is exact in force and moment,
  # bilinear (the code default) loses 2-6 % of the moment.
  load_transfer: !!str 'strut_lever'

  # -- solver --
  # Panels per structural section: on the FEM geometry's 27 sections, 5 =
  # 135 panels, within 0.5 % of 324 panels in CL and CD at 4-8 deg on the
  # billowed wing (convergence study 2026-10-28, docs/aerostructural/).
  # Billow full flies 2 per section (its own BILLOW_CONFIG_DEFAULTS).
  n_aero_panels_per_struc_section: !!int 5
  spanwise_panel_distribution: !!str 'uniform'
  max_iterations: !!int 1500
  # allowed_error and gamma_loop_type are a MATCHED PAIR (2026-08-31): the
  # Anderson-accelerated loop terminates on a superlinear, non-smooth residual
  # that corrupts the coupled trim's finite-difference Jacobian unless the
  # tolerance is ~1e-8 (measured -2.2% v_tau at the shipped 2e-6). Revert BOTH
  # to base / 2e-6 together, never one alone. On steered, AV-active flow 1e-8
  # can be unreachable for any loop and the point fails -- accepted by design:
  # a failed point is recorded, not protected against.
  allowed_error: !!float 1e-8
  gamma_loop_type: !!str 'anderson'
  # Anderson gets iteration HEADROOM instead of a Picard fallback
  # (2026-09-03): across the 2019+2025 steering campaigns the base-loop
  # fallback rescued 99 of ~92,400 Anderson failures (0.1%) while costing up
  # to two 1500-iteration relaxed-Picard crawls per failure. 100 -> 1000
  # accelerated iterations with the fallback OFF is cheaper even when it
  # still fails, and gives Anderson a real chance to break the deep
  # post-stall limit cycle.
  anderson_max_iterations: !!int 1000
  anderson_fallback_to_base: !!bool false
  relaxation_factor: !!float 0.025

structure:
  ## wireframe  (Billow's line system: cables, tension-only lines, pulleys --
  ## see src/awetrim/aerostructural/wireframe/), solved by minimising the
  ## total potential energy. The Particle System Simulator and its kinetic
  ## damping were removed 2026-09-12; the keys that only configured the
  ## relaxation are ignored if present.
  wireframe:
    # Flies the stiffnesses of structure.yml (E*A/l0 from each line's material
    # and diameter, the datasheet moduli). The in-loop elongation-bound
    # stiffening of the PSM file's too-soft lines was removed 2026-11-02; the
    # element elongations stay a diagnostic of every run
    # (max_element_elongation in the meta).
    # -- solver --
    nlp_tolerance: !!float 1.0e-8        # IPOPT tol
    nlp_max_iterations: !!int 1000       # IPOPT iteration cap
    nlp_anchor_stiffness: !!float 1.0e-3 # [N/m] pins force-free fully-slack nodes

  ## billow  (minimum-energy: cables, pulleys, inflatable tube beams,
  ## wrinkling membrane canopy -- see src/awetrim/aerostructural/billow/)
  billow:
    # -- model --
    # -- canopy fabric --
    # The REAL cloth, not a value matched to a spring net. Polyester
    # ripstop at the 170 g/m2 struc_geometry records: solid-equivalent thickness
    # 0.170/1380 = 123 um, in-plane modulus ~4 GPa (crimp-derated), so
    # E*t ~ 4.9e5 N/m. A spring net's 5000 N/m is E = 20 MPa -- rubber -- and a canopy
    # that soft billows instead of carrying load and bends the struts with it.
    # The modulus is a material ESTIMATE; a tensile test on the cloth replaces it.
    canopy_stiffness: !!float 4.93e5
    canopy_thickness: !!float 1.232e-4
    canopy_poisson_ratio: !!float 0.3
    canopy_wrinkling: !!bool true        # Pipkin relaxed (tension-field) energy
    # -- inflatable tubes --
    # Scales the whole fitted moment-curvature curve, initial slope included.
    # The hanging-kite validation implies a factor well below one.
    tube_stiffness_factor: !!float 1.0
    junction_frame: !!str 'strut'        # who owns the LE/strut joint frame
    # -- bridle relaxation --
    # The YAML stores measured rest lengths against measured node positions and
    # the two disagree (Br_main_1 is 11.5% long, i.e. 88 kN at the real EA/l0).
    # This settles the bridle onto the built wing before the coupled run starts.
    relax_bridles: !!bool true
    # -- solver --
    canopy_slack_stiffness_ratio: !!float 1.0e-4  # never 0 on a canopy that can go slack
    relax_pull_force: !!float -100.0
    relax_settle_force: !!float -1.0
    relax_move_limit: !!float 0.25
    # move_limit turns one solve into one trust-region step and an outer loop
    # drives it to force balance; without it a slack-dominated configuration
    # hands IPOPT a flat direction and the line search collapses.
    move_limit: !!float 0.25
    max_rounds: !!int 12
    max_iterations: !!int 400
    tolerance: !!float 1.0e-8
    # Proportionate to the outer gate (coupling.loop), not far tighter than
    # it: this is a floor, and relative_force_tolerance x total load is what
    # normally decides.
    force_tolerance: !!float 1.0e-3
    relative_force_tolerance: !!float 1.0e-5
    print_info: !!bool false

## The tether in the trim and the aerostructural solvers (a ROM run states its
## own in the ROM file). Diameter and density come from system.yaml.
#   model: 'rigid_lumped' (scalar tension along z, drag lumped at kite)
#          'williams'     (distributed-mass, kite -> ground iteration with
#                          three unknowns: elevation_last, azimuth_last,
#                          tether_length; ground anchor pinned at origin)
tether:
  # -- model --
  # include_in_trim: carry the tether in the aerostructural QSM trim.
  # false = the historical TETHERLESS trim: its residuals are the
  # tangential force balance only, so the tether is implicitly massless,
  # dragless and perfectly radial.
  # true = the tether-aware trim, which adds the tether's off-radial drag and
  # weight to the kite force balance. 'model' selects which:
  #   'rigid_lumped' - lumped drag + half weight at the kite; 6th unknown is the
  #                    radial tension. Cheap.
  #   'williams'     - full distributed shape with ground closure; 6th unknown
  #                    is the tether length. Costs a nested tether solve per
  #                    residual evaluation, so the coupled loop gets much slower.
  include_in_trim: !!bool true
  model: !!str 'williams'
  is_elastic: !!bool false
  cf: !!float 0.01           # tangential skin-friction coefficient (Williams only)
  wind_model: !!str 'uniform'  # 'logarithmic' or 'uniform' (Williams only)
  # -- solver --
  n_elements: !!int 10       # Williams discretisation

## How the aerodynamics and the structure are coupled: the quasi-steady trim,
## the load transfer and the fixed-point loop.
coupling:
  # -- model --
  # The kite's weight in the trim. Off for ROM identification: the ROM adds
  # the weight itself in the point-mass model (identification.yaml).
  is_with_gravity: !!bool false
  is_with_forcing_symmetry: !!bool false

  ## load transfer: panel to node, of Billow's FULL fidelity
  ## (coupled/aero2struc.py). The wireframe maps panel corners onto its ribs
  ## (aerodynamics.load_transfer) and reads none of this.
  load_transfer:
    # relative to the project root (aerostructural.case.resolve_config_paths)
    cp_distribution_path: data/LEI-V3-KITE/cp_distributions/cp_AOA_8.dat
    # Where the chordwise weights put a panel's resultant IS its local pitching
    # moment, and the wing's trim is a moment balance.
    #   cp_file        one measured Delta C_p shape for every panel, so the
    #                  resultant sits at 0.291 c regardless of the panel's own
    #                  C_m. The default.
    #   moment_matched keeps that shape as a prior and tilts it onto the centre
    #                  of pressure VSM computes from the panel's own F and M, so
    #                  force AND moment are both conserved.
    chordwise_distribution: !!str 'cp_file'
    coupling_method: !!str 'NN'
    eps: !!float 1e-6
    power_for_inverse_weighting: !!float 2.0

  # -- solver --
  is_run_only_1_time_step: !!bool false
  is_with_initial_point_velocity: !!bool false
  initial_geometry_rotation_deg: !!float 0.0
  # the step the commanded tape changes (the Case's) are walked in [m]
  power_tape_extension_step: !!float 0.05
  steering_tape_extension_step: !!float 0.05

  ## the quasi-steady trim (the coupled loop's least-squares trim, aerodynamic_vsm)
  trim:
    # Cap on trim residual evaluations per coupled iteration (scipy
    # least_squares max_nfev). 8 = roughly one warm-started Gauss-Newton step:
    # the trim and the geometry then converge TOGETHER instead of the trim
    # being polished against every intermediate shape (quasi-monolithic).
    # Truncated trims are kept, flagged trim_truncated, never sent to the
    # direct-solve fallback. Validated 2026-09-10: identical physics, chain
    # wall 355 -> 311 s on the depower A/B; 20 measured WORSE than 8 -- spend
    # little per iteration. Comment out for the uncapped historical trim
    # (standalone single-solve scripts want that; this cap is only sound
    # inside the coupled loop's warm restarts).
    max_nfev: !!int 8

    # Search bounds for quasi-steady variables [physical units as noted]
    # These define the feasible region for the optimizer to explore.
    # Narrower bounds = fewer evaluations, faster convergence, but risk missing solutions.
    # Wider bounds = more thorough search but slower optimization.
    kite_speed_bounds_ms: !!seq [-2.0, 50.0]      # m/s - apparent wind relative speed
    roll_bounds_deg: !!seq [-4.0, 4.0]            # degrees - wing roll angle
    pitch_bounds_deg: !!seq [-4.0, 4.0]           # degrees - pitch angle
    yaw_bounds_deg: !!seq [-4.0, 4.0]             # degrees - yaw angle
    course_rate_bounds_rad_s: !!seq [-2.5, 2.5]   # rad/s - angular velocity about vertical axis

    # Overrides for the PRE-LOOP trim only (the first trim, on the undeformed
    # geometry). Each trim's roll/pitch/yaw are applied to the structure as a
    # rotation, so in the coupled loop the bounds above limit the per-iteration
    # INCREMENT, but here they limit the whole attitude. At 40 deg elevation the
    # first trim needs ~10 deg of yaw; pinned at 4 it closed the moment with a
    # ~2 rad/s course rate, stalled the tips and VSM returned NaN.
    pre_loop:
      roll_bounds_deg: !!seq [-15.0, 15.0]
      pitch_bounds_deg: !!seq [-15.0, 15.0]
      yaw_bounds_deg: !!seq [-15.0, 15.0]

  ## the fixed-point loop between the aerodynamics and the structure
  loop:
    max_iter: !!int 200 # was 100; the realised-steering gate holds steered rows to ~50-90 iterations (2026-09-23)
    # Coupled gate: the DIMENSIONLESS ||f_int + f_ext|| / |sum f_ext|, the nodal
    # force residual over the tether load, for BOTH drivers (wireframe/PSM and
    # Billow). Since 2026-10-12 the only gate in this file. It replaced the
    # absolute `tol: 5` [N], which could not pin the answer across a sweep: 5 N
    # is 6.8e-4 of the tether load at 7.4 kN but 1.3e-3 at 3.9 kN, and the SAME
    # point landed 5-15% apart in CL, CD and tether force depending only on
    # whether it was reached cold or warm; on the Billow baseline
    # (run_simulation_BILLOW inputs) it exited at iteration 2 with the tether
    # force 3.8% below the fixed point (4298 vs 4468 N). Results stored under
    # `tol: 5` do not reproduce under this gate. A caller that wants the legacy
    # absolute gate sets `tol` (+ `stagnation_tol`) [N] AND removes
    # residual_tol_relative; with both present the relative one wins
    # (convergence.resolve_residual_tolerances).
    residual_tol_relative: !!float 1.0e-4
    stagnation_tol_relative: !!float 4.0e-5 # residual span over n_max_constant_residual_force iterations below this = stagnated
    # Second exit condition (both drivers, convergence.force_settle_state): the
    # tether force must also have settled, at least 5 iterations since the last
    # tape or stiffness change, with its spread or estimated remaining change
    # within this fraction. The residual alone reads small on the first relaxed
    # iteration (Billow baseline: 1.5e-4 at iteration 1, force 3.8% short); this
    # makes an exit there impossible. 0 disables.
    force_settle_rtol: !!float 1.0e-4
    is_with_aitken_relaxation: !!bool true
    relaxation_factor: !!float 0.05 #0.05-0.3
    n_max_constant_residual_force: !!int 10
    qs_state_stagnation_decimals: !!int 2 # stop if opt_x is unchanged at this rounding
    qs_state_stagnation_n_iter: !!int 30 # consecutive unchanged iterations required to stop (0 disables)
    qs_speed_bound_patience: !!int 3 # runaway stop: trim pinned on its kite-speed bound this many iterations in a row -> not converged (0 disables)
    steering_actuation_interval_iters: !!int 2 # apply steering actuation every N coupled iterations
    steering_settle_iterations_after_update: !!int 6 # no convergence exit this many iterations after a steering tape update: the rolled/turning equilibrium grows out of a mm-level asymmetry whose residual sits below the gate (u_s 0.025/0.05 rows froze symmetric in 3 iterations on 2026-09-01)
    steering_realised_tol_m: !!float 5.0e-3 # realised-actuation gate (2026-09-23): no exit while the tape endpoint half-difference is further than this [m] from the commanded rest-length half-difference (0 disables)
    steering_realised_remaining_tol_m: !!float 1.0e-3 # ... or with more creep than this [m] still to come (geometric tail of the realised value since the last steering step): Billow rows u_s 0.075-0.125 exited 15-25 mm short and creeping 1 mm/it on 2026-09-13
    steering_realised_rate_floor_m: !!float 2.0e-5 # a realised value moving less than this [m] per iteration counts as arrived whatever the tail estimator says (nanometre noise on a residual limit cycle reads as a non-decaying tail)
