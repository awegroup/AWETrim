# Inputs of the ROM identification, workflow step 3
# (examples/3_rom_identification/, see its README).
#
# sweep: the coupled aerostructural states run_identification_sweep.py solves
#        at the centre of the wind window, gravity off: continuation chains in
#        depower and in steering, each converged state with a frozen-shape
#        angle-of-attack polar about it.
# fit:   the kite constants identify_rom_aerostructural.py fits the ROM with.
#
# Both blocks hold the settings common to every structural fidelity plus a
# `fidelities:` block whose entry for the chosen fidelity is merged over them
# (nested dicts key by key). `fidelity` picks the default; both scripts take
# --fidelity to override it, and write under
# results/<kite>/identification/<fidelity>/.
#   billow     Billow's FULL model: inflatable tube beams, wrinkling membrane
#              canopy and the bridle (structure.yml, awesIO).
#   wireframe  Billow's line system, REDUCED from the same full FEM file
#              (wireframe.driver.build_case_reduced_fem: one structural file
#              for both fidelities), flying the full geometry's aerodynamic
#              mesh with canopy billowing and the exact (strut-lever) load
#              transfer (docs/aerostructural/). The official identification
#              since 2026-10-28 (rom_config_aerostructural.yaml, 2026-10-29).
#              Until then this block flew the PSM wireframe (short chord,
#              17.2 m2, TE rest lengths cut to 0.95 x CAD by hand; removed
#              2026-10-29, in v0.1.0).

fidelity: wireframe

sweep:
  system_file: system.yaml      # in this folder: the masses (KCU) and the tether
  # The flight state of every solve (awetrim.aerostructural.case.Case):
  # course-frame angles [deg], tether length [m], reel speed [m/s], steady
  # flight, and the wind law. The wind SPEED comes from wind_speeds and the
  # tape command from the chains.
  case:
    elevation_deg: 0.0
    azimuth_deg: 0.0
    course_deg: 90.0
    distance_radial: 300.0
    speed_radial: 0.0
    timeder_speed_tangential: 0.0
    timeder_speed_radial: 0.0
    wind:
      model: uniform
  # Merged over as_config.yaml for every solve (its subsystem blocks).
  # Gravity off: the ROM adds the kite's weight itself in the point-mass model.
  overrides:
    coupling:
      is_with_gravity: false
  # Wind at the reference height of the kite's wind model [m/s], one set of
  # chains per value. Without reel-out the kite flies at about 5 x the wind,
  # v_a 20 and 25 m/s: inside the flown band.
  wind_speeds: [4.0, 5.0]
  # Depower chains: from the tape length the geometry is built at, the power
  # tape walks to each target rest length l_dp [m] in steps of `step`.
  # Steering chains: at each power-tape length the tape is walked to first,
  # then the steering half-difference [m] grows to `max` in steps of `step`.
  steering:
    max: 0.10
    step: 0.025
  # A chain stops at the first state that does not converge or whose stalled
  # span fraction exceeds this. `steering.max_stalled_fraction` overrides it for
  # the steering chains. What enters the fit is the fit's own cut.
  max_stalled_fraction: 0.2
  # Frozen-shape polar about every state: [min, max, step] increments [deg]. The
  # polar is the march DOWN from the maximum (the realistic stall), so that has to
  # be well past the stall: from +14 the 1.40 m state had not fully stalled.
  polar_d_alpha_deg: [-6.0, 22.0, 1.0]
  # Every state is moved to that branch before its polar (the default; a chain
  # alone stays attached past the realistic stall). False only to compare.
  settle_on_down_branch: true

  fidelities:
    billow:
      # The step-2 aerodynamics: 27 sections x 2 = 54 panels, VSM's base
      # circulation loop (with artificial viscosity the stalled tips trap the
      # Anderson loop). The canopy needs a tether force well above ~2000 N to
      # keep its symmetric equilibrium (aerostructural/AGENTS.md).
      overrides:
        aerodynamics:
          n_aero_panels_per_struc_section: 2
          gamma_loop_type: base
      # Built at 1.90 m. The full model flies the flown reel-out loads at a
      # longer tape than the flight's 1.7 m, so the range reaches 2.6 m.
      depower:
        targets: [1.75, 2.60]
        step: 0.05
      steering:
        power_tape_lengths: [2.10, 2.40]
    wireframe:
      fem_geometry: structure.yml
      system_file: system_flown_2019.yaml   # the hardware the shipped ROM used
      # The structure flies the FEM file's own stiffnesses: its Dyneema is the
      # datasheet 109 GPa (the PSM file's 10 GPa needed a hand-applied x9 and
      # an in-loop stiffening, both removed 2026-11-02).
      # The wireframe flies at about 3.8 x the wind: 6 m/s reaches v_a 23.
      wind_speeds: [4.0, 5.0, 6.0]
      # The aerodynamics are as_config's: 135 panels on the billowed wing
      # (5 % contraction) with the strut-lever load transfer.
      # Built at 1.90 m (the FEM file); the range covers the flown reel-out
      # and reel-in tapes and depowers enough to reel in.
      depower:
        targets: [1.10, 2.60]
        step: 0.05
      # Across the ROM band (fit: depower_band; 1.50 m is its powered end), through both flight-match
      # tapes (fit: flight_match): 1.95 = reel-out, 2.40 near reel-in; 1.70 / 2.10
      # the previous model's match. To 0.50 m = |u_s| 0.36, past the flown +-35 %
      # KCU (0.49 m at u_s = kcu/100; a multiple of step, so a chain can be extended
      # and resumed); the stall stop ends a chain earlier where the tip stalls.
      steering:
        power_tape_lengths: [1.40, 1.50, 1.70, 1.95, 2.10, 2.40]
        max: 0.50
        # Never stop on stall: the steering limit is read from what lies past it,
        # so these chains end at `max` or at a state that does not converge.
        max_stalled_fraction: 1.0
      # The turn-rate law's b(u_p), c5, c6 (awetrim.identification.turn_law;
      # --turn-law). At the centre v_tau / v_a is fixed per tape, so the chains
      # cannot separate b from the gain: these anchors are re-solved tetherless
      # at the centre at mass scale 0 and 1 (b per tape: the 0.10 m steering
      # state at 5 m/s on every steering tape, and the 0.20 m one at 1.95 m), and
      # the gravity anchor with gravity on at each [elevation, azimuth, course]
      # [deg] (c5, c6: courses 0-270 at 30 deg, and 10 / 60 deg elevation).
      turn_law:
        inertia_anchors: [w5.0_steering_1.40/03, w5.0_steering_1.50/03, w5.0_steering_1.70/03,
                          w5.0_steering_1.95/03, w5.0_steering_2.10/03, w5.0_steering_2.40/03]
        gravity_anchors: [w5.0_steering_1.95/07]
        gravity_states: [[10, 0, 90], [30, 0, 0], [30, 0, 90], [30, 0, 180], [30, 0, 270],
                         [60, 0, 90]]

fit:
  # The area the ROM's coefficients are normalised by [m2]: the EKF / flight
  # area, which the flight-corrected ROM keeps (system.yaml's 17.21 m2 is the
  # projected geometry).
  reference_area: 19.75
  # States whose stalled span fraction exceeds this stay out of the coefficients
  # and the roll gain: the ROM is the attached kite's, its stall from their polars.
  max_stalled_fraction: 0.2
  # The angle of attack the ROM may be flown to stays this far below its stall
  # [deg]: a 1 m/s gust turns the inflow by atan(1 / v_a), 2.5-3.8 deg at the
  # v_a of 6-4 m/s wind.
  stall_margin_deg: 3.0
  # Steering-tape half-difference per unit of the ROM's u_s [m]
  # (awetrim.identification.controls: the standardised flight scale).
  steering_tape_per_unit_us: 1.4
  # Written to the ROM file as its `tether` block: the tether a ROM run
  # flies with. ROM runs use the rigid lumped tether; the aerostructural
  # runs state theirs in as_config.
  rom_tether:
    model: rigid_lumped
  # The u_p = l_dp range the coefficients are fitted on [m], and the ROM's
  # `controls` block: the tape lengths of the powered and depowered phases,
  # the band the trajectory optimiser works in. These are modelling choices
  # for whoever identifies the kite. The tape coordinate is the model's own, so
  # each fidelity sets its own; the values below are the current LEI-V3
  # estimates.
  fidelities:
    # The full model reaches the flown reel-out tether force at about 2.1 m
    # and the reel-in at about 2.5 m: a longer tape than the flight's
    # 1.7 / 2.1 m, because its trim flies a higher angle of attack.
    billow:
      depower_band: [2.0, 2.6]
      controls:
        input_depower:
          powered: 2.1
          depowered: 2.5
    # Powered end 1.50 m: a 1 m/s gust (alpha + atan(1 m/s / v_a)) stays below the
    # stall onset of the realistic (down) branch, 5 % C_L drop, by 1.5-2.6 deg at
    # 4-6 m/s; at 1.40 m it does not (-0.65 deg at 4 m/s). Fitted down to 1.40 m, the
    # shortest tape not itself stalled (1.35 m is, at 11 % less tension), so the
    # band's edge is not extrapolated; a stalled depower setting is no operating
    # point, so it is outside the fit, while the polars of 1.40 m still reach past
    # the stall. Depowered end 2.60 m = end
    # of the sweep, the C_L slope still linear 6 deg below every trim. The force
    # margin (15 % lull, 2 x KCU weight: F_t >= 602 N) depends on the wind, so it
    # is a tension floor for the optimiser, not a tape limit.
    wireframe:
      depower_band: [1.40, 2.6]
      # The states the ROM's stall angle is measured on: near their stall, where the
      # onset is readable (on longer tapes the trim is too far below it).
      stall_onset_tapes: [1.40, 1.70]
      controls:
        input_depower:
          powered: 1.5
          depowered: 2.6
      # Copied into the ROM's validity block. Minimum kite-end tether force
      # [N]: 2 x KCU weight after a 15 % speed lull, 435 N / 0.85^2 (435 N =
      # 2 x 22.2 kg x g; the 2019 file's flown KCU is 22.0 kg, i.e. 597 N --
      # the 1 % is inside the margin's own precision).
      validity:
        # the optimiser's depower box is clipped to it. Powered end 1.70 m, not
        # the 1.50 m the ROM was fitted to: the 2025 flights show the kite
        # stalling already at 1.70 m, which the simulations do not reproduce
        input_depower: [1.70, 2.60]
        min_tether_force_n: 602.0
      # The turn law of --steering-law turn_rate (Cayon & Schmehl, in preparation,
      # Eq. 33): w (v_a + b m v_tau) + b F_g,n + c5 F_g,chi + c6 F_g,r =
      # a(u_p, u_s) v_a^2 u_s. b(u_p), c5, c6 are measured on the sweep's
      # turn-law states (sweep: turn_law), a is fitted on the chains with them.
      # The degree of b(u_p) in the tape:
      turn_law:
        inertia_degree: 1
      # The model tape that reproduces each flown phase (the fit does not read it): the
      # one that best zeroes the median tension and speed errors of the ROM's own solve,
      # logged steering in, 2019 training cycles. Written by
      # examples/5_flight_data/identify_rom_flight_correction.py; re-run it whenever the
      # ROM changes. The steering tapes follow it.
      flight_match:
        flight: 2019
        date: 2026-11-05
        reel_out: 1.95
        reel_in: 2.48
