metadata:
  recalibration: >-
    2026-10-07: theta0, theta1, cd0, cd_us_abs, gain recalibrated by scripts/identification/refine_rom_flight_output_error.py --rom semi_empirical (output error on the quasi-steady tension and v_tau of 24 2019 training cycles, cycles 60-67 held out, roll gain held by the measured aerodynamic roll) on the corrected bridle-angle frame of Kite._force_in_wind_frame; the paper's values were calibrated on the pre-fix frame. Report: results\LEI-V3-KITE\identification\rom_flight_correction\output_error_semi_empirical\refinement_report.json
  description: >-
    SEMI-EMPIRICAL ROM of the LEI-V3 kite (Cayon, van Deursen, Schmehl 2026,
    WES 11, 1097, Sect. 5.1): rigid-VSM polar fits with drag offsets and the
    pitch/roll parameters calibrated so the ROM reproduces flight-identified
    (EKF) CL/CD at the powered, steered and depowered states. Its
    simulation-only counterpart is rom_config_aerostructural.yaml.
  control_convention: >-
    u_p is the absolute power-tape length l_dp [m] (2019 powered ~= 1.7 m,
    depowered ~= 2.1 m); u_s is the STANDARDISED steering of
    awetrim.identification.controls: 1.4 m x u_s = the steering-tape
    half-difference (2019 flight: u_s = -kcu/200, full KCU deflection +-0.175).
    Converted 2026-10 from the legacy -kcu/100 unit: every u_s-linear
    coefficient doubled (same physics).

# Depower band the ROM was identified on, in its u_p unit; read by
# awetrim.identification.controls.rom_depower_band and REQUIRED by the
# full-cycle scripts. An optional ``validity: {angle_of_attack_deg: [lo, hi]}``
# block would replace the optimizer's default AoA bound.
controls:
  input_depower:
    powered: 1.7
    depowered: 2.1

aerodynamics:
  model: "coeffs"
  # Area the coefficients are referenced to (the EKF/flight area they were
  # identified on). Overrides the system file's projected_surface_area, so
  # optimisation (system.yaml, 17.2119 m2 projected) and validation
  # (system_flown_*.yaml) now apply the SAME forces. Until 2026-10 the file did
  # not state it and optimisation ran these coefficients on 17.2119 m2, i.e.
  # with aerodynamic forces 13 % low.
  reference_area: 19.75   # m2
  # Flight-calibrated: the KCU (and in 2019 its turbine) flew with the wing,
  # so their drag is already inside C_D; the ROM adds no separate KCU drag.
  kcu_drag_in_coefficients: true
  params:
    CL0: 0.04671295
    # Geometric pitch between the bridle resultant and the wing chord (paper
    # Eqs. 1-2, alpha_w = alpha_b - theta_b), theta_b = angle_pitch_tether_0 +
    # slope_angle_pitch_tether_depower * u_p, u_p = l_dp [m]. Anchored to the
    # 2019 states by C_L matching: theta_b 7.89 deg at 1.7 m, 18.36 deg at
    # 2.1 m. (Pre-2026-10 keys: angle_pitch_depower_0 = -angle_pitch_tether_0,
    # delta_pitch_depower = -slope_angle_pitch_tether_depower.) Paper values
    # (pre-fix frame): CD0 0.113142, theta_b -0.638999 + 0.456901 u_p (7.89 deg
    # at 1.7 m, 18.36 deg at 2.1 m), gain -0.688820, |u_s| drag 0.1285714; see
    # metadata.recalibration for the 2026-10-07 values below.
    CD0: 0.104879
    angle_pitch_tether_0: -0.547305           # rad
    slope_angle_pitch_tether_depower: 0.395302   # rad/m
    # Steering -> aerodynamic roll, phi_a,w = gain_roll_steering * u_s [rad]
    # (paper Eq. 43). Was carried as CS u_s = 0.12 / 0.35 with the sign flipped.
    gain_roll_steering: -0.693502   # rad per u_s
    # Stall angle [rad], used by the optimiser's stall margin
    # (sim_parameters.stall_margin_deg). This ROM has no stall model; its C_L
    # polynomial peaks at alpha = 6.0913 / (2 x 10.1123) = 0.3012 rad = 17.3 deg.
    angle_of_attack_stall: 0.3012
  coefficients:
    CL:
      - var: alpha
        power: 1
        coef: 6.09131779
      - var: alpha
        power: 2
        coef: -10.11227433
      - var: u_s
        power: 1
        coef: 0.0
      - var: u_p
        power: 1
        coef: -0.0
    CD:
      - var: alpha
        power: 1
        coef: 0.01460944
      - var: alpha
        power: 2
        coef: 1.56422478
      # u_s terms rescaled for the new convention u_s = -kcu/100 (full = +/-1).
      # Legacy validation used u_s = -kcu/max|kcu| (~ -kcu/35), so same physical
      # steering now gives a 0.35x smaller u_s; coefficients divided by 0.35
      # (x 100/35 ~= 2.857). In the solved QS trim only the CD_us/CS ratio
      # (0.1875) matters, so this is physics-neutral; it also matches the
      # -kcu/100 guess scale and improves IPOPT conditioning.
      - var: u_s
        power: 1
        coef: 0.206321   # recalibrated 2026-10-07 (paper: 0.1285714 = 2 x 0.0642857 legacy)
        abs: true         # symmetric in left/right steering (|u_s|)
      - var: u_p
        power: 1
        coef: -0.00

tether:
  model: "williams"
  n_elements: 10
  wind_model: "uniform"
  cf: 0.01
  is_elastic: false
