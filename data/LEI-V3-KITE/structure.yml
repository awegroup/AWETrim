metadata:
  name: LEI-V3-KITE
  description: 'TU Delft LEI V3 kite: inflatable leading edge and struts, membrane canopy, the full bridle down to the a/b/c/d lines that fan onto each strut, its pulleys, and the depower and steering tapes to the KCU.'
  note: 'Resolved by AWETrim from its former struc_geometry_FEM_full.yaml (strut padding bisect_longest, canopy chord nodes generated between the struts). Positions are the kite''s KA frame with the KCU at the origin; the KCU mass is NOT here (system.yaml is its single source). Bridle rest lengths are the photogrammetry-adjusted ones; a3_b3, ab2_cd2 and ab3_cd3 were changed to match measurements. Line material is Dyneema SK75 at the datasheet''s lower modulus 109 GPa (a braided rope is softer than the fibre); its density 1499 kg/m^3 is an equivalent value that gives the right mass per metre at the stored diameters. The steering and depower tapes are 12 x 1.5 mm webbing: diameter is area-equivalent (mass, EA), tape_width is the drag width. a5_equiv and br_5_equiv are equivalent legs (0.5 a5 + a5_e, 0.5 br_5 + br_5_e). Wing mass 11 kg (canopy 170 g/m^2, the rest on the tubes by length). Tube law: Breukels (2011) as Billow evaluates it, at 0.3 bar.'
  awesIO_version: 0.1.0
  schema: structure_schema.yml
  n_points: 268
  connectivity_sha: 2d3b214845eb3cc7bd1dbcd3dc57c5f4095ced07cd47f67affedbe2f5fb5b8bb
