metadata:
  name: LEI-V3-KITE
  description: LEI V3 soft kite pumping ground gen system (TU Delft / Kitepower
    research kite)
  note: None
  awesIO_version: 0.1.0
  schema: system_schema.yml

assembly:
  # Joint-id topology: kite KCU (K1) -> tether top (T1); tether bottom (T2) -> drum (G1)
  connectivity_matrix:
  - [K1, T1]
  - [T2, G1]

components:
  kites:
  - name: LEI-V3 Kite
    type: soft_kite_kcu
    version: 1.0
    joints:
      kcu_joint:
        id: K1
    # Kite aggregate (wing + bridle + KCU) mass/CG/inertia is derived on demand
    # from the structural geometry via
    # awetrim.aerostructural.utils.compute_kite_aggregate — it is not stored here.
    wing:
      name: LEI-V3
      type: LEI_soft_kite
      version: 3.0
      structure:
        projected_surface_area: 19.5902 # m², of the FEM edges
        span: 8.3052                   # m
        mass: 11.0                     # kg
        # Canopy-only (no bridle, KCU or canopy-mounted equipment), from
        # structure.yml (awetrim.utils.system_yml_sync.
        # compute_wing_stats). CG and inertia are in that file's
        # frame: origin at the bridle point (KCU), x chordwise LE -> TE,
        # y spanwise, z up towards the wing. The inertia is about the CG, along
        # those axes (not principal axes), with products -sum(m x z).
        center_of_mass:                         # m
        - -0.0641
        - -0.0
        - 10.3527
        inertia_tensor:
        - - 87.7593
          - 0.0
          - 0.6692
        - - 0.0
          - 14.0092
          - -0.0
        - - 0.6692
          - -0.0
          - 87.1131
        side_projected_area: 0.3487
        planform_surface_area: 24.4223
    bridle:
      name: LEI-V3 Bridle
      type: LEI_soft_kite_bridle
      version: 1.0
      structure:
        bridle_point_node: [0, 0, 0]
        # From structure.yml (system_yml_sync.compute_bridle_stats)
        total_nominal_line_length: 86.548    # m, sum of unique bridle_line l0 values
        avg_line_diameter: 0.00283           # m, connection-length-weighted average
        mass: 2.5848                         # kg, lines + pulleys
    control_system:
      name: LEI-V3 KCU
      type: kite_control_unit
      version: 1.0
      structure:
        length: 1.0      # m
        diameter: 0.48   # m
        mass: 8.4        # kg
        center_of_mass: [0.0, 0.0, 0.0]  # m, same as bridle_point_node
        # Actuator operational limits used by the trajectory optimizer. The
        # trim optimiser reads these as hardware bounds (range) and slew-rate
        # limits (rate); they override the numerical fallbacks in
        # awetrim.utils.defaults.DEFAULT_OPTI_LIMITS.
        steering:
          # Standardised u_s (identification.controls): 1.4 m x u_s = the
          # steering-tape half-difference. 2019 KCU: u_s = -kcu/200, so its
          # +-35 % deflection is +-0.175 (was +-0.35 in the legacy -kcu/100).
          range: [-0.175, 0.175]  # u_s [-]
          rate: [-0.145, 0.145]   # d(u_s)/dt [1/s] (2019 flight max ~29 kcu/s)
        depower:
          # power-tape length l_dp [m]: the band identified with gust margins
          # (identification.yaml fit validity: 1.30 stall margin, 2.60 the
          # depowered end), which the ROM's validity band also states
          range: [1.30, 2.60]
          rate: [-0.2, 0.2]      # d(l_dp)/dt [m/s]
  tethers:
  - name: LEI-V3 Tether
    type: non_conductive_tether
    version: 1.0
    joints:
      upper_tether_joint:
        id: T1
      lower_tether_joint:
        id: T2
    structure:
      length: 415.0        # m  (max operational reference length) — must exceed
                           # the run's reelout_l_max plus one lap's reel-out
                           # (~35 m), or the lap cannot complete: at r0 = 340 m
                           # a lap ends near 375 m and the 350 cap forced short,
                           # over-tight patterns or outright failures.
      diameter: 0.008      # m  (8 mm) — as flown; drag area scales with this
      density: 724.0       # kg/m³  effective density of the braided rope, not of
                           # the SK78 fibre (970): with the rope's own diameter it
                           # is the rope's mass per metre that has to come out right
      max_tether_force: 8400.0  # N
      material:
        type: Dyneema-SK78
  ground_station:
    name: LEI-V3 Ground Station
    type: pumping_ground_gen_station
    version: 1.0
    joints:
      drum_joint:
        id: G1
    structure:
      mass: 0.0
    drums:
    - name: LEI-V3 Drum
      type: electric_winch
      max_tether_force: 8400.0  # N — drum rating; matches the tether rating above
      # Winch drive envelope: a representative one, not a specific ground
      # station's. The 3.5 m/s reel-out limit is conservative, leaving a real
      # drive margin for gusts. Read by awetrim.system.factory._extract_hardware_limits
      # and mapped onto the trajectory optimizer's radial limits:
      #   min/max_tether_speed   -> DEFAULT_OPTI_LIMITS["speed_radial"] bounds
      #   max_winch_acceleration -> the +/- slew-rate limit on v_r used by the
      #                             free_speed winch mode (winch_acceleration)
      # Sign convention: positive = reel-out, negative = reel-in.
      min_tether_speed: -8.0        # m/s (max reel-in speed)
      max_tether_speed: 3.5         # m/s (max reel-out speed)
      max_winch_acceleration: 4.0   # m/s²

# Reduced-order model this system runs with (awetrim.system.factory.
# resolve_rom_config_path). The LEI-V3 default is rom_config_aerostructural.yaml
# (simulation-only: FEM-reduced wireframe with canopy billowing, identified
# 2026-10-29). rom_config_aerostructural_flight_corrected.yaml is its 2019
# flight correction (theta_b, dC_D, the roll-gain scale; redone 2026-10-29).
models:
  reduced_order:
    aerodynamics: rom_config_aerostructural.yaml
