# As-flown configuration of the 2019-10-08 flight, per the hardware datasheet
# (2026-09-02): wing 14.2 kg (11 kg canopy + 3.2 kg canopy-mounted equipment),
# KCU 22.0 kg (19.2 kg KCU+cover + 2.8 kg onboard wind turbine), 10 mm tether.
# Total airborne kite mass ~38.79 kg (wing 14.2 + bridle 2.5875 + KCU 22.0).
# The 2025-10-09 flight used a different KCU and tether -- see
# system_flown_2025.yaml. For optimization studies use system.yaml
# (KCU 8.4 kg) instead.
metadata:
  name: LEI-V3-KITE
  description: LEI V3 soft kite pumping ground gen system (TU Delft / Kitepower
    research kite)
  note: None
  awesIO_version: 0.1.0
  schema: system_schema.yml

assembly:
  # Joint-id topology: kite KCU (K1) -> tether top (T1); tether bottom (T2) -> drum (G1)
  connectivity_matrix:
  - [K1, T1]
  - [T2, G1]

components:
  kites:
  - name: LEI-V3 Kite
    type: soft_kite_kcu
    version: 1.0
    joints:
      kcu_joint:
        id: K1
    # Kite aggregate (wing + bridle + KCU) mass/CG/inertia is derived on demand
    # from the structural geometry via
    # awetrim.aerostructural.utils.compute_kite_aggregate — it is not stored here.
    wing:
      name: LEI-V3
      type: LEI_soft_kite
      version: 3.0
      structure:
        # Populated by populate_system_yml.py (mass overridden below)
        projected_surface_area: 19.75 # m²
        span: 8.282                    # m
        # 11 kg canopy + 3.2 kg canopy-mounted equipment (datasheet); the
        # geometry-derived canopy-only mass is 10.9926 kg, and the inertia
        # tensor below is still that canopy-only estimate.
        mass: 14.2                     # kg
        center_of_mass:                         # m
        - -0.0413
        - -0.0
        - 10.3
        inertia_tensor:
        - - 84.6787
          - 0.0
          - 0.8031
        - - 0.0
          - 18.6955
          - 0.0
        - - 0.8031
          - 0.0
          - 88.6081
        side_projected_area: 0.2923
        planform_surface_area: 21.0559
    bridle:
      name: LEI-V3 Bridle
      type: LEI_soft_kite_bridle
      version: 1.0
      structure:
        bridle_point_node: [0, 0, 0]
        # Populated by populate_system_yml.py
        total_nominal_line_length: 79.522    # m, sum of unique bridle_line l0 values
        avg_line_diameter: 0.00285           # m, connection-length-weighted average
        material:
          type: dyneema
          density: 724.0           # kg/m³
          youngs_modulus: 20.0e+9   # Pa
          damping_per_stiffness: 0.0
        mass: 2.5875                         # kg, lines + pulleys
    control_system:
      name: LEI-V3 KCU
      type: kite_control_unit
      version: 1.0
      structure:
        length: 1.0      # m
        # Area-equivalent diameter of the datasheet's 0.25 m² KCU frontal
        # area (kcu_drag uses pi*(d/2)^2 as the frontal area): d = 0.5642 m.
        diameter: 0.5642 # m
        mass: 22.0       # kg, 19.2 KCU+cover + 2.8 onboard wind turbine
        center_of_mass: [0.0, 0.0, 0.0]  # m, same as bridle_point_node
      # Onboard 4-bladed ram-air turbine (2019 flight ONLY -- the 2025 KCU
      # carried none), DRAG only: its mass is inside the KCU mass above.
      # Mounted ON TOP of the KCU facing the apparent wind: its
      # momentum-theory thrust C_T on the swept area joins the KCU CROSSFLOW
      # drag; the along-tether flow is shadowed by the KCU body, so it adds
      # nothing axially -- awetrim.aerodynamics.kcu_drag (added 2026-09-04;
      # trim A/B: reel-out v_tau/F_t land ~on the flight).
      turbine:
        diameter: 0.50            # m, rotor
        thrust_coefficient: 0.85  # -, operating (Betz 0.89; freewheel ~1.2)
  tethers:
  - name: LEI-V3 Tether
    type: non_conductive_tether
    version: 1.0
    joints:
      upper_tether_joint:
        id: T1
      lower_tether_joint:
        id: T2
    structure:
      length: 350.0        # m  (max operational reference length)
      diameter: 0.010      # m  (10 mm)
      density: 724.0       # kg/m³  (effective braided-rope density, datasheet;
                           # kept 2026-09-04 after a trim A/B: a braid is
                           # ~25-30% air, so the solid-fibre 970 over-weights
                           # a real 10 mm Dyneema braid (0.076 vs the typical
                           # 0.05-0.065 kg/m). The turbine drag, not the
                           # density, explained the fit gap.
                           #  SK78 fibre itself is ~970)
      max_tether_force: 8400.0  # N
      conductive: false
      material:
        type: Dyneema-SK78
        youngs_modulus: 850.0e+6  # Pa (0.85 GPa)
  ground_station:
    name: LEI-V3 Ground Station
    type: pumping_ground_gen_station
    version: 1.0
    joints:
      drum_joint:
        id: G1
    structure:
      mass: 0.0
    drums:
    - name: LEI-V3 Drum
      type: electric_winch
      max_tether_force: 8400.0  # N
    gearboxes:
    - name: LEI-V3 Gearbox
      type: planetary
      gear_ratio: 1.0

# Reduced-order model this system runs with (awetrim.system.factory.
# resolve_rom_config_path). The LEI-V3 has two: rom_config_semi_empirical.yaml
# (flight-calibrated) and rom_config_aerostructural.yaml (simulation-only).
models:
  reduced_order:
    aerodynamics: rom_config_semi_empirical.yaml
