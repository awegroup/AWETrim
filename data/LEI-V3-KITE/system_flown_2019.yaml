# As-flown configuration of the 2019-10-08 flight, per the hardware datasheet
# (2026-09-02): wing 14.2 kg (11 kg canopy + 3.2 kg canopy-mounted equipment),
# KCU 22.0 kg (19.2 kg KCU+cover + 2.8 kg onboard wind turbine, stated
# separately in control_system.turbine), 10 mm tether.
# Total airborne kite mass ~38.79 kg (wing 14.2 + bridle 2.5848 + KCU 22.0).
# The 2025-10-09 flight used a different KCU and tether -- see
# system_flown_2025.yaml. For optimization studies use system.yaml
# (KCU 8.4 kg) instead.
metadata:
  name: LEI-V3-KITE
  description: LEI V3 soft kite pumping ground gen system (TU Delft / Kitepower
    research kite)
  note: None
  awesIO_version: 0.1.0
  schema: system_schema.yml

assembly:
  # Joint-id topology: kite KCU (K1) -> tether top (T1); tether bottom (T2) -> drum (G1)
  connectivity_matrix:
  - [K1, T1]
  - [T2, G1]

components:
  kites:
  - name: LEI-V3 Kite
    type: soft_kite_kcu
    version: 1.0
    joints:
      kcu_joint:
        id: K1
    # Kite aggregate (wing + bridle + KCU) mass/CG/inertia is derived on demand
    # from the structural geometry via
    # awetrim.aerostructural.utils.compute_kite_aggregate — it is not stored here.
    wing:
      name: LEI-V3
      type: LEI_soft_kite
      version: 3.0
      structure:
        # Geometry fields derived from structure.yml; the
        # projected area is the EKF reference area (19.75 m2, the ROMs'
        # too), the mass the as-flown one below.
        projected_surface_area: 19.75 # m²
        span: 8.3052                   # m
        # 11 kg canopy + 3.2 kg canopy-mounted equipment (datasheet); the
        # geometry-derived canopy-only mass is 11.0 kg, and the inertia
        # tensor below is still that canopy-only estimate.
        mass: 14.2                     # kg
        # Canopy-only (no bridle, KCU or canopy-mounted equipment), from
        # structure.yml (awetrim.utils.system_yml_sync.
        # compute_wing_stats). CG and inertia are in that file's
        # frame: origin at the bridle point (KCU), x chordwise LE -> TE,
        # y spanwise, z up towards the wing. The inertia is about the CG, along
        # those axes (not principal axes), with products -sum(m x z).
        center_of_mass:                         # m
        - -0.0641
        - -0.0
        - 10.3527
        inertia_tensor:
        - - 87.7593
          - 0.0
          - 0.6692
        - - 0.0
          - 14.0092
          - -0.0
        - - 0.6692
          - -0.0
          - 87.1131
        side_projected_area: 0.3487
        planform_surface_area: 24.4223
    bridle:
      name: LEI-V3 Bridle
      type: LEI_soft_kite_bridle
      version: 1.0
      structure:
        bridle_point_node: [0, 0, 0]
        # From structure.yml (system_yml_sync.compute_bridle_stats)
        total_nominal_line_length: 86.548    # m, sum of unique bridle_line l0 values
        avg_line_diameter: 0.00283           # m, connection-length-weighted average
        mass: 2.5848                         # kg, lines + pulleys
    control_system:
      name: LEI-V3 KCU
      type: kite_control_unit
      version: 1.0
      structure:
        length: 1.0      # m
        # Area-equivalent diameter of the datasheet's 0.25 m² KCU frontal
        # area (kcu_drag uses pi*(d/2)^2 as the frontal area): d = 0.5642 m.
        diameter: 0.5642 # m
        mass: 19.2       # kg, KCU+cover WITHOUT the turbine (its mass is below)
        center_of_mass: [0.0, 0.0, 0.0]  # m, same as bridle_point_node
      # Onboard 4-bladed ram-air turbine (2019 flight ONLY -- the 2025 KCU
      # carried none). awesIO keeps its mass separate; AWETrim lumps it into
      # the KCU (utils.system_config.get_kcu_mass: 19.2 + 2.8 = 22.0 kg).
      # Mounted ON TOP of the KCU facing the apparent wind: its
      # momentum-theory thrust (C_T = kcu_drag.CT_TURBINE_OPERATING, 0.85)
      # on the swept area joins the KCU CROSSFLOW drag; the along-tether flow
      # is shadowed by the KCU body, so it adds nothing axially --
      # awetrim.aerodynamics.kcu_drag (added 2026-09-04; trim A/B: reel-out
      # v_tau/F_t land ~on the flight).
      turbine:
        name: LEI-V3 KCU turbine
        type: horizontal_axis_turbine
        version: 1.0
        structure:
          rotor_diameter: 0.50       # m
          number_of_blades: 4
          mass: 2.8                  # kg, NOT in the KCU mass above
          position_KA: [0.0, 0.0, 0.5]  # m, hub; ESTIMATE (top of the 1.0 m KCU), not measured
  tethers:
  - name: LEI-V3 Tether
    type: non_conductive_tether
    version: 1.0
    joints:
      upper_tether_joint:
        id: T1
      lower_tether_joint:
        id: T2
    structure:
      length: 350.0        # m  (max operational reference length)
      diameter: 0.010      # m  (10 mm)
      density: 724.0       # kg/m³  (effective braided-rope density, datasheet;
                           # kept 2026-09-04 after a trim A/B: a braid is
                           # ~25-30% air, so the solid-fibre 970 over-weights
                           # a real 10 mm Dyneema braid (0.076 vs the typical
                           # 0.05-0.065 kg/m). The turbine drag, not the
                           # density, explained the fit gap.
                           #  SK78 fibre itself is ~970)
      max_tether_force: 8400.0  # N
      material:
        type: Dyneema-SK78
  ground_station:
    name: LEI-V3 Ground Station
    type: pumping_ground_gen_station
    version: 1.0
    joints:
      drum_joint:
        id: G1
    structure:
      mass: 0.0
    drums:
    - name: LEI-V3 Drum
      type: electric_winch
      max_tether_force: 8400.0  # N

# Reduced-order model this system runs with (awetrim.system.factory.
# resolve_rom_config_path). The LEI-V3 default is rom_config_aerostructural.yaml
# (simulation-only: FEM-reduced wireframe with canopy billowing, identified
# 2026-10-29). rom_config_aerostructural_flight_corrected.yaml is its 2019
# flight correction (theta_b, dC_D, the roll-gain scale; redone 2026-10-29).
models:
  reduced_order:
    aerodynamics: rom_config_aerostructural.yaml
