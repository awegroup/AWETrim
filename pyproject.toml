[project]
name = "awetrim"
version = "1.0.0"
description = "Aerostructural modelling, trim analysis, and trajectory optimisation for soft-kite Airborne Wind Energy Systems (AWES)"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
keywords = [
  "airborne-wind-energy",
  "soft-kite",
  "aerostructural-simulation",
  "trajectory-optimisation",
  "vortex-step-method",
  "minimum-energy-structural-model",
  "reduced-order-modelling",
  "wind-energy",
]

authors = [
  {name = "Oriol Cayon", email = "oriol.cayon@gmail.com"},
]
maintainers = [
  {name = "Oriol Cayon", email = "oriol.cayon@gmail.com"},
]

# Classifiers help categorize the project on PyPI and aid in discoverability.
# For a full list of valid classifiers, see https://pypi.org/classifiers/
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "numpy",
  "pandas>=1.5.3",
  "matplotlib>=3.7.1",
  "casadi",
  "h5py",
  "scipy",
  "PyYAML",
  "prompt_toolkit",
  "vplot3d @ git+https://github.com/rschmehl/vplot3d.git@c5efdc8ffb96832eaaf3f7d7749cac923c2516f7",
  "billow @ git+https://github.com/awegroup/Billow.git@ec6fb79e0a0af8706eda325f309154fd24fa7aae",
  # Pinned: aerodynamics/panel_kernels.py and trim_casadi.py mirror VSM's
  # panel force law and its CasADi panel function, so a VSM change there
  # breaks the CasADi trim. 1201f6f = VSM develop with the curved
  # bound-vortex / attached-trailed-force work (2026-10-13); move the pin only
  # together with the kernels (tests/aerodynamics/test_panel_kernels.py).
  "VSM @ git+https://github.com/awegroup/Vortex-Step-Method.git@1201f6fd1e4c419159ce8867cbb654210d9ef060",
  # EKF-AWE: the shared KCU drag model (awetrim.aerodynamics.kcu_drag). Its flight
  # reconstructions are read by awetrim.flight_data, not produced here.
  "awes-ekf @ git+https://github.com/awegroup/EKF-AWE.git@52579b914fefa070e8298539e68677cbcdb7c4b8",
  "awesIO @ git+https://github.com/awegroup/awesIO.git@5799a2dbd3e74c83914dae342aa6d9a43b2180e1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "black",
  "httpx",
  ]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]",
  "pydantic>=2",
  ]

[project.urls]
"Homepage" = "https://github.com/awegroup/AWETrim"
"Documentation" = "https://awegroup.github.io/AWETrim/"
"Source" = "https://github.com/awegroup/AWETrim"
"Issues" = "https://github.com/awegroup/AWETrim/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--strict-markers -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
    "*/__pycache__/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
