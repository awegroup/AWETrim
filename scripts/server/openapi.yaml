    post:
      summary: Reset
      operationId: reset_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '409':
          description: A solve is running and cannot be interrupted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
