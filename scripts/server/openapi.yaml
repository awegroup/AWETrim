    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WinchParams:
      properties:
        mode:
          type: string
          enum:
          - reelout
          - reelin
          title: Mode
          description: Phase to optimize; only 'reelout' is supported for now
          default: reelout
        k_v:
          type: number
          exclusiveMinimum: 0.0
          title: K V
          description: 'Winch law gain: v_set = k_v * sqrt(force)'
        f_min:
          type: number
          minimum: 0.0
          title: F Min
          description: Minimum winch force [N]
        f_max:
          type: number
          exclusiveMinimum: 0.0
          title: F Max
          description: Maximum winch force [N]
        v_max:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: V Max
          description: Maximum reel-out speed [m/s]
        p_max:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: P Max
          description: Maximum winch power [W]; alternative to v_max (v_max = p_max / f_max)
      additionalProperties: false
      type: object
      required:
      - k_v
      - f_min
      - f_max
      title: WinchParams
      description: 'Ground-station winch controller: v_set = k_v * sqrt(force).'
    ErrorDetail:
      title: ErrorDetail
      type: object
      properties:
        detail:
          title: Detail
          type: string
      required:
      - detail
