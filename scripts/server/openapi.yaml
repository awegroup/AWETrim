    post:
      summary: Init
      description: |-
        Set up the session. The reply contains the InitParams struct
        (name, winch_params, inflow_conditions, trajectory); the
        trajectory is the fitted STARTING path — call /step to optimize it.
      operationId: init_init_post
      requestBody:
        content:
