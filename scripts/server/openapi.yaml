            rejects.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: A solve is still running — wait for /status to leave 'solving'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /status:
    get:
      summary: Status
      operationId: status_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /step:
    post:
      summary: Step
      description: |-
        One warm-started re-optimization.

        Default (wait=true): blocks until the solve finishes and the reply
        contains the StepParams struct (winch_params + OPTIMIZED trajectory
        + the depower it assumes + the turn-radius limit it respects).
        With wait=false: returns 202 immediately; poll /status and fetch
        /trajectory. An infeasible request returns 422 with the solver
        message; the previous trajectory stays available.
      operationId: step_step_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepRequest'
        required: true
      responses:
        '200':
          description: 'Solve finished (wait=true): the optimized StepParams struct.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepReply'
        '202':
          description: 'Solve accepted (wait=false): poll /status, then fetch /trajectory.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepAccepted'
        '400':
          description: A value the session model rejects, e.g. winch mode 'reelin'.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: Called before /init, or while a solve is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Request validation failed, or the optimization was infeasible / did
            not converge. The previous trajectory stays available from /trajectory.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPValidationError'
                - $ref: '#/components/schemas/ErrorDetail'
  /trajectory:
    get:
      summary: Trajectory
      operationId: trajectory_trajectory_get
      parameters:
      - name: resimulate
        in: query
        required: false
        schema:
          type: boolean
          description: Also re-fly the optimized pattern for a full timeseries (x/y/z, power,
            ...). Slower; rejected while solving.
          default: false
          title: Resimulate
        description: Also re-fly the optimized pattern for a full timeseries (x/y/z, power,
          ...). Slower; rejected while solving.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
